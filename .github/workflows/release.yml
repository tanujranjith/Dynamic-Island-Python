name: Release

# Builds the normal self-contained app plus an opt-in test ZIP containing a
# pinned, hash-verified official Codex runtime.
#
# Trigger either by pushing a version tag or manually from the Actions tab.
# The tag must be vMAJOR.MINOR.PATCH and must match the project version.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (vMAJOR.MINOR.PATCH)'
        required: true

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve and validate release version
        id: version
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          $tag = $env:RELEASE_TAG.Trim()
          if ($tag -notmatch '^v(?<Version>\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?(?:\+[0-9A-Za-z.-]+)?)$') {
            throw "Release tag '$tag' must use vMAJOR.MINOR.PATCH format."
          }

          $appVersion = $Matches.Version
          [xml]$project = Get-Content .\DynamicIsland.Windows\DynamicIsland.Windows.csproj
          $versionNode = $project.SelectSingleNode('/Project/PropertyGroup/Version')
          if ($null -eq $versionNode -or [string]::IsNullOrWhiteSpace($versionNode.InnerText)) {
            throw 'Project version could not be read from DynamicIsland.Windows.csproj.'
          }
          $projectVersion = $versionNode.InnerText.Trim()
          if ($projectVersion -ne $appVersion) {
            throw "Release tag version '$appVersion' does not match project version '$projectVersion'."
          }

          "tag=$tag" >> $env:GITHUB_OUTPUT
          "app_version=$appVersion" >> $env:GITHUB_OUTPUT

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Run release tests
        run: dotnet test .\DynamicIsland.Windows.Tests\DynamicIsland.Windows.Tests.csproj -c Release -m:1

      - name: Publish self-contained single-file exe
        run: dotnet publish .\DynamicIsland.Windows\DynamicIsland.Windows.csproj -c Release -r win-x64

      - name: Stage asset as DynamicIsland.exe
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Recurse -Path .\DynamicIsland.Windows\bin\Release -Filter DynamicIsland.Windows.exe |
                 Where-Object { $_.FullName -match '\\publish\\' } | Select-Object -First 1
          if (-not $exe) { throw "published exe not found" }
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item $exe.FullName dist\DynamicIsland.exe
          "Staged: $((Get-Item dist\DynamicIsland.exe).Length / 1MB) MB"

      - name: Download pinned official Codex runtime
        shell: pwsh
        run: |
          Invoke-WebRequest 'https://github.com/openai/codex/releases/download/rust-v0.151.0/codex-x86_64-pc-windows-msvc.exe' -OutFile dist\codex-x86_64-pc-windows-msvc.exe
          Invoke-WebRequest 'https://github.com/openai/codex/releases/download/rust-v0.151.0/codex-code-mode-host-x86_64-pc-windows-msvc.exe' -OutFile dist\codex-code-mode-host-x86_64-pc-windows-msvc.exe

      - name: Package hash-verified Codex test build
        shell: pwsh
        env:
          APP_VERSION: ${{ steps.version.outputs.app_version }}
        run: |
          .\scripts\Package-CodexTestBuild.ps1 `
            -PublishedExe dist\DynamicIsland.exe `
            -CodexExe dist\codex-x86_64-pc-windows-msvc.exe `
            -CodeModeHostExe dist\codex-code-mode-host-x86_64-pc-windows-msvc.exe `
            -OutputDirectory dist `
            -AppVersion $env:APP_VERSION

      - name: Create / update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          files: |
            dist/DynamicIsland.exe
            dist/DynamicIsland-Codex-Test-v${{ steps.version.outputs.app_version }}-win-x64.zip
